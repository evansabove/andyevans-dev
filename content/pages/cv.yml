biography:
  image: /andyevans.jpeg
  imageAlt: "Andy Evans, senior software engineer based in Sheffield, UK"
  text: |
    <p>I'm Andy Evans, a senior software engineer based in Sheffield, UK, with over 12 years building production software. I work primarily in C# and .NET, and I take the lead on the parts most teams find hardest: platform engineering, CI/CD, and getting things deployed and running reliably on Azure.</p>
    <p>I'm a resilient and logical problem solver. I write software in whatever tools the problem demands, I care about the codebase being simple enough for the next person to understand, and I've spent most of my career as the person a team turns to when something is broken or unclear. I'm also passionate about mentoring and building great teams.</p>

