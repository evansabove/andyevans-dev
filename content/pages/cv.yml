howIWork:
  - title: "I solve problems"
    text: "I'm a resilient and logical problem solver, with creative ideas on solutions. I work hard to find the ideal solution, but I'm pragmatic enough to know when to look for alternative options."
  - title: "I own delivery end to end"
    text: "It's no good writing code unless you can deploy it somewhere. I take the lead on deploying solutions to Azure, building CI/CD pipelines, and running workloads on Kubernetes and on-prem infrastructure. I own work from user story through development, testing and release."
  - title: "I learn what the problem needs"
    text: "Tech is constantly evolving. If my existing skillset doesn't contain the tools for the problem at hand, I set about learning what I need - languages, tools, libraries - to get the job done. That's led to adventures in Vue, Python, Kotlin and Android alongside my day-to-day C#."
  - title: "I simplify what I inherit"
    text: "I've taken tangled, confusing codebases and turned them into the simple solutions they always could have been. Leaving a codebase easier to work in than I found it is one of the most valuable things I can do for a team."
  - title: "I mentor and build teams"
    text: "One of my most important roles is mentoring other team members, formally or informally. I like to be a person who is trusted and approachable, and who can help build the careers of others."

