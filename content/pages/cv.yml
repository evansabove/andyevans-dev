  text: |
    <p>I'm Andy Evans, a software engineer based in Sheffield, UK. I currently work for Razor Ltd, a software and AI consultancy.</p>
    <p>My background is in full-stack software development, building complex web-based systems for a variety of industries and applications.
    Over the last 15 years I've worked in a broad range of industries, with a huge range of languages and tools.</p>
    <p>More recently, I've had the opportunity to take on a platform engineering role. This has given me the chance to treat other engineers and individuals as my clients
    - building tools to make their lives easier, and to make the build and delivery of software more efficient and reliable.

